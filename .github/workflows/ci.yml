name: Verify and deliver

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PASSWORD: integration-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify on H2
        run: docker compose run --build --rm -T test-h2
      - name: Verify on PostgreSQL and copy the JAR
        run: |
          trap 'docker rm -f orm-verify >/dev/null 2>&1 || true' EXIT
          docker compose run --name orm-verify -T test-postgres
          mkdir -p artifacts
          docker cp orm-verify:/workspace/target/orm-platform-1.0.0.jar artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: orm-platform-jar
          path: artifacts/orm-platform-*.jar
          if-no-files-found: error
      - name: Remove test containers and data
        if: always()
        run: docker compose --profile test down --volumes

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PASSWORD: compose-test-only
      IMAGE_REGISTRY: public.ecr.aws/docker/library
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and the application
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Check the demo catalog and homepage
        run: |
          docker compose run --build --rm -T tools bash -o pipefail -ec '
            for attempt in {1..30}; do
              if curl -fsS --max-time 5 http://app:8080/api/courses |
                jq -e "any(.[]; .title == \"Основы Hibernate\")" >/dev/null; then
                curl -fsS --max-time 5 http://app:8080/ | grep -F "Практикум ORM"
                exit
              fi
              sleep 2
            done
            echo "The demo course did not become available" >&2
            exit 1
          '
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove test containers and data
        if: always()
        run: docker compose down --volumes

  deliver:
    needs: [verify, compose]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish the versioned application image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$image" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
