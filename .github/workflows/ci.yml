name: Verify and deliver

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: integration-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform_test -d platform_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/platform_test
      TEST_DB_USER: platform_test
      TEST_DB_PASSWORD: integration-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: orm-platform-jar
          path: target/orm-platform-*.jar
          if-no-files-found: error

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PASSWORD: compose-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and the application
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Check the demo catalog and homepage
        run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 \
            http://localhost:8080/api/courses | jq -e 'any(.[]; .title == "Основы Hibernate")'
          curl --fail --silent --show-error http://localhost:8080/ | grep -F 'Практикум ORM'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove test containers and data
        if: always()
        run: docker compose down --volumes

  deliver:
    needs: [verify, compose]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish the versioned application image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$image" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
