x-maven-test: &maven-test
  image: orm-platform-test:local
  build:
    context: .
    target: sources
  command: ["mvn", "-B", "verify"]
  volumes:
    - maven-cache:/root/.m2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "platform", "-d", "platform"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/platform
      DB_USER: platform
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  test-h2:
    <<: *maven-test
    profiles: [test]

  test-postgres:
    <<: *maven-test
    profiles: [test]
    environment:
      TEST_DB_URL: jdbc:postgresql://postgres-test:5432/platform_test
      TEST_DB_USER: platform_test
      TEST_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: platform_test
      POSTGRES_USER: platform_test
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "platform_test", "-d", "platform_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  tools:
    profiles: [tools]
    build:
      context: .
      target: tools

volumes:
  postgres-data:
  maven-cache:
